<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consola de Riesgo Tecnológico — CPGRTI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
  :root{
    --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#E7EBEF; --surface-3:#DCE2E8;
    --border:#CBD3DB; --text:#17212B; --text-muted:#57677A;
    --accent:#1E4B72; --accent-2:#2F6690; --accent-soft:#E2ECF3;
    --risk-bajo:#3E8E62; --risk-bajo-soft:#E3F1E8;
    --risk-medio:#B8862A; --risk-medio-soft:#F7EDDA;
    --risk-alto:#C0692F; --risk-alto-soft:#F8E7D9;
    --risk-critico:#AC3527; --risk-critico-soft:#F7DEDA;
    --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
    --shadow: 0 1px 2px rgba(23,33,43,.06), 0 4px 14px rgba(23,33,43,.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0F1620; --surface:#161F2B; --surface-2:#1D2733; --surface-3:#26313F;
      --border:#2C3946; --text:#E7EDF3; --text-muted:#8FA0B3;
      --accent:#6FA8D6; --accent-2:#8FBEE3; --accent-soft:#1B2E3F;
      --risk-bajo:#5FBE8B; --risk-bajo-soft:#173226;
      --risk-medio:#E3B94E; --risk-medio-soft:#332A15;
      --risk-alto:#E89A57; --risk-alto-soft:#37270f;
      --risk-critico:#E8654F; --risk-critico-soft:#3a1c17;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 18px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1620; --surface:#161F2B; --surface-2:#1D2733; --surface-3:#26313F;
    --border:#2C3946; --text:#E7EDF3; --text-muted:#8FA0B3;
    --accent:#6FA8D6; --accent-2:#8FBEE3; --accent-soft:#1B2E3F;
    --risk-bajo:#5FBE8B; --risk-bajo-soft:#173226;
    --risk-medio:#E3B94E; --risk-medio-soft:#332A15;
    --risk-alto:#E89A57; --risk-alto-soft:#37270f;
    --risk-critico:#E8654F; --risk-critico-soft:#3a1c17;
    color-scheme: dark;
  }
  :root[data-theme="light"]{
    --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#E7EBEF; --surface-3:#DCE2E8;
    --border:#CBD3DB; --text:#17212B; --text-muted:#57677A;
    --accent:#1E4B72; --accent-2:#2F6690; --accent-soft:#E2ECF3;
    --risk-bajo:#3E8E62; --risk-bajo-soft:#E3F1E8;
    --risk-medio:#B8862A; --risk-medio-soft:#F7EDDA;
    --risk-alto:#C0692F; --risk-alto-soft:#F8E7D9;
    --risk-critico:#AC3527; --risk-critico-soft:#F7DEDA;
    color-scheme: light;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font-body);
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--font-display); font-weight:700; text-wrap:balance; margin:0;}
  a{color:var(--accent);}
  button, input, select, textarea{font-family:inherit; font-size:inherit; color:inherit;}
  button{cursor:pointer;}
  ::selection{background:var(--accent-soft);}
  .num{font-variant-numeric:tabular-nums; font-family:var(--font-mono);}

  #app{min-height:100vh; display:flex; flex-direction:column;}

  /* ---- Header ---- */
  header.appbar{
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:14px 22px; display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    position:sticky; top:0; z-index:20;
  }
  .brand{display:flex; flex-direction:column; gap:1px; min-width:220px;}
  .brand .mark{font-family:var(--font-display); font-size:20px; font-weight:700; color:var(--accent); letter-spacing:.2px;}
  .brand .org{font-size:12px; color:var(--text-muted);}
  .brand .org input{
    background:transparent; border:none; border-bottom:1px dashed transparent; color:var(--text-muted);
    font-size:12px; padding:0; width:260px;
  }
  .brand .org input:hover, .brand .org input:focus{border-bottom-color:var(--border); outline:none;}
  .headctl{margin-left:auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .headctl label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); display:block; margin-bottom:2px;}
  .headctl .field select, .headctl .field input[type=date]{
    background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:5px 8px; color:var(--text);
  }
  .btn{
    background:var(--accent); color:#fff; border:1px solid var(--accent); border-radius:7px;
    padding:8px 14px; font-size:13px; font-weight:600; white-space:nowrap;
  }
  .btn:hover{background:var(--accent-2); border-color:var(--accent-2);}
  .btn.ghost{background:transparent; color:var(--accent); border-color:var(--border);}
  .btn.ghost:hover{background:var(--accent-soft); border-color:var(--accent);}
  .btn.subtle{background:var(--surface-2); color:var(--text); border-color:var(--border);}
  .btn.subtle:hover{background:var(--surface-3);}
  .btn.danger{background:transparent; color:var(--risk-critico); border-color:var(--border);}
  .btn.danger:hover{background:var(--risk-critico-soft);}
  .btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  .btn[disabled]{opacity:.45; cursor:not-allowed;}

  /* ---- Nav ---- */
  nav.tabs{
    background:var(--surface); border-bottom:1px solid var(--border);
    display:flex; gap:2px; padding:0 16px; overflow-x:auto; position:sticky; top:65px; z-index:19;
  }
  nav.tabs button{
    background:none; border:none; border-bottom:2px solid transparent; padding:11px 14px 9px;
    font-size:13px; font-weight:600; color:var(--text-muted); white-space:nowrap; display:flex; gap:7px; align-items:center;
  }
  nav.tabs button .ic{font-size:14px; opacity:.85;}
  nav.tabs button:hover{color:var(--text);}
  nav.tabs button.active{color:var(--accent); border-bottom-color:var(--accent);}
  nav.tabs button .badge{
    background:var(--risk-critico); color:#fff; font-size:10px; font-weight:700; border-radius:999px;
    padding:1px 6px; font-family:var(--font-mono);
  }

  main{flex:1; padding:22px; max-width:1440px; margin:0 auto; width:100%;}
  .view-title{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:4px; flex-wrap:wrap;}
  .view-title h2{font-size:23px;}
  .view-sub{color:var(--text-muted); font-size:13px; margin-bottom:20px; max-width:74ch;}

  /* ---- Cards / grid ---- */
  .grid{display:grid; gap:16px;}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-2{grid-template-columns:repeat(2,1fr);}
  @media (max-width:1080px){ .grid.cols-4{grid-template-columns:repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:640px){ .grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;} }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px;
    box-shadow:var(--shadow);
  }
  .card h3{font-size:14px; font-family:var(--font-body); font-weight:700; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .card h3 .hint{font-weight:500; font-size:11px; color:var(--text-muted); text-transform:none;}

  .stat{padding:18px; display:flex; flex-direction:column; gap:6px;}
  .stat .label{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); font-weight:600;}
  .stat .value{font-family:var(--font-display); font-size:34px; line-height:1;}
  .stat .sub{font-size:12px; color:var(--text-muted);}
  .stat.warn .value{color:var(--risk-critico);}

  /* ---- Pills / severity ---- */
  .pill{
    display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px;
    font-size:11.5px; font-weight:700; letter-spacing:.01em; white-space:nowrap;
  }
  .pill .dot{width:6px; height:6px; border-radius:50%; background:currentColor;}
  .pill.bajo{color:var(--risk-bajo); background:var(--risk-bajo-soft);}
  .pill.medio{color:var(--risk-medio); background:var(--risk-medio-soft);}
  .pill.alto{color:var(--risk-alto); background:var(--risk-alto-soft);}
  .pill.critico{color:var(--risk-critico); background:var(--risk-critico-soft);}
  .pill.verde{color:var(--risk-bajo); background:var(--risk-bajo-soft);}
  .pill.amarillo{color:var(--risk-medio); background:var(--risk-medio-soft);}
  .pill.rojo{color:var(--risk-critico); background:var(--risk-critico-soft);}
  .pill.neutro{color:var(--text-muted); background:var(--surface-2);}

  .stripe{width:4px; align-self:stretch; border-radius:3px; flex-shrink:0;}
  .stripe.bajo{background:var(--risk-bajo);}
  .stripe.medio{background:var(--risk-medio);}
  .stripe.alto{background:var(--risk-alto);}
  .stripe.critico{background:var(--risk-critico);}

  /* ---- Table ---- */
  .tablewrap{overflow-x:auto; border:1px solid var(--border); border-radius:10px; background:var(--surface);}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted);
    background:var(--surface-2); padding:9px 12px; border-bottom:1px solid var(--border); white-space:nowrap; font-weight:700;
  }
  tbody td{padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}
  td.num, th.num{text-align:right; font-family:var(--font-mono);}
  .rowlink{background:none;border:none;color:var(--accent);font-weight:600;padding:2px 4px;}
  .rowlink:hover{text-decoration:underline;}
  .muted{color:var(--text-muted);}
  .small{font-size:12px;}

  /* ---- Heatmap widget ---- */
  .heatmap-toolbar{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
  .dim-tabs{display:flex; gap:5px; flex-wrap:wrap;}
  .dim-tab{
    background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:5px 11px;
    font-size:11.5px; font-weight:600; color:var(--text-muted); white-space:nowrap;
  }
  .dim-tab:hover{color:var(--text); border-color:var(--accent);}
  .dim-tab.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .vista-toggle{display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0;}
  .vista-toggle button{
    background:var(--surface-2); border:none; padding:6px 13px; font-size:11.5px; font-weight:700; color:var(--text-muted);
    border-left:1px solid var(--border);
  }
  .vista-toggle button:first-child{border-left:none;}
  .vista-toggle button.active{background:var(--accent); color:#fff;}
  .heatmap-filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
  .heatmap-filters select{
    background:var(--surface-2); border:1px solid var(--border); border-radius:7px; padding:5px 8px; font-size:12px; color:var(--text);
    max-width:220px;
  }
  .heatmap-filters .flabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); font-weight:700; display:block; margin-bottom:2px;}
  /* the matrix header uses a fixed navy panel in both themes — it reads as a printed reference table, not a themed surface */
  table.heatmap-table{border-collapse:separate; border-spacing:4px; width:100%; --heat-navy:#1B3A5C; --heat-navy-2:#2C567F;}
  table.heatmap-table th{background:var(--heat-navy); border:none; font-size:11px; text-transform:none; letter-spacing:0; padding:8px 8px; color:#EAF1F8; font-weight:700; border-radius:6px;}
  table.heatmap-table th.corner{font-size:10.5px; text-align:left; vertical-align:bottom; background:var(--heat-navy);}
  table.heatmap-table th.colhead{text-align:center; line-height:1.35;}
  table.heatmap-table th.colhead .sub, table.heatmap-table th.rowhead .sub{display:block; font-weight:500; font-size:9.5px; color:#B9CBDC; text-transform:none; letter-spacing:0; margin-top:1px;}
  table.heatmap-table th.rowhead{text-align:right; white-space:normal; padding-right:12px; background:var(--heat-navy-2); line-height:1.35;}
  .heat-td{
    position:relative; border-radius:7px; height:62px; min-width:78px; text-align:center; vertical-align:middle;
    cursor:pointer; border:2px solid transparent; transition:border-color .12s ease, transform .12s ease;
  }
  .heat-td:hover{border-color:var(--text); transform:translateY(-1px);}
  .heat-td.selected{border-color:var(--text); box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--text);}
  .heat-td .count-badge{
    display:block; font-size:19px; font-weight:700; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.25); font-family:var(--font-mono);
  }
  .heat-td .warn-badge{
    position:absolute; top:4px; right:5px; font-size:9.5px; font-weight:700; color:var(--risk-critico);
    background:#fff; border-radius:999px; padding:1px 4px; line-height:1.3;
  }
  .heatmap-detail{
    margin-top:12px; border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:0 8px 8px 0;
    background:var(--accent-soft); padding:12px 14px;
  }
  .heatmap-detail .hdr{font-size:12px; font-weight:700; margin-bottom:8px; display:flex; justify-content:space-between;}
  .heatmap-detail .hdr button{background:none; border:none; color:var(--text-muted); font-size:12px; font-weight:600;}
  .heatmap-detail .item{padding:6px 0; border-bottom:1px solid var(--border); font-size:12.5px;}
  .heatmap-detail .item:last-child{border-bottom:none;}

  /* ---- Sparkline ---- */
  .spark{display:block;}

  /* ---- Forms / modal ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(15,22,32,.55); display:flex; align-items:flex-start; justify-content:center;
    padding:40px 16px; z-index:100; overflow-y:auto;
  }
  .modal{
    background:var(--surface); border:1px solid var(--border); border-radius:12px; width:100%; max-width:640px;
    box-shadow:0 20px 60px rgba(0,0,0,.35); padding:22px 24px 20px;
  }
  .modal h3{font-size:17px; font-family:var(--font-display); margin-bottom:14px;}
  .formgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px 14px;}
  .formgrid .full{grid-column:1/3;}
  @media (max-width:560px){ .formgrid{grid-template-columns:1fr;} .formgrid .full{grid-column:1;} }
  .field label{display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); font-weight:700; margin-bottom:4px;}
  .field input, .field select, .field textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:7px; padding:8px 10px; color:var(--text);
  }
  .field textarea{resize:vertical; min-height:56px; font-family:var(--font-body);}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}

  .empty{padding:38px 20px; text-align:center; color:var(--text-muted);}
  .empty .big{font-size:28px; display:block; margin-bottom:6px; font-family:var(--font-display); color:var(--text);}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg);
    padding:9px 18px; border-radius:8px; font-size:13px; font-weight:600; z-index:200; box-shadow:var(--shadow);
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1; transform:translate(-50%,-4px);}

  .kri-row{display:flex; gap:12px; align-items:center; padding:11px 0; border-bottom:1px solid var(--border);}
  .kri-row:last-child{border-bottom:none;}
  .kri-meta{flex:1; min-width:0;}
  .kri-meta .name{font-weight:700; font-size:13px;}
  .kri-meta .type{font-size:11px; color:var(--text-muted);}
  .kri-val{font-family:var(--font-mono); font-size:20px; font-weight:700; width:64px; text-align:right;}

  .procbar{height:6px; border-radius:4px; background:var(--surface-3); overflow:hidden; margin-top:6px;}
  .procbar > div{height:100%;}

  .section-note{
    background:var(--accent-soft); border:1px solid var(--border); border-left:3px solid var(--accent);
    border-radius:0 8px 8px 0; padding:10px 14px; font-size:12.5px; color:var(--text-muted); margin-bottom:16px;
  }
  .section-note b{color:var(--text);}

  fieldset{border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin:0 0 14px;}
  legend{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); font-weight:700; padding:0 6px;}

  footer.appfoot{padding:26px 22px 40px; text-align:center; color:var(--text-muted); font-size:11.5px;}

  @media print{
    header.appbar, nav.tabs, .btn, footer.appfoot, .no-print{display:none !important;}
    body{background:#fff; color:#000;}
    main{max-width:none;}
  }

  /* ---- Auth / onboarding screens ---- */
  .authwrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .authcard{background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); padding:32px; width:100%; max-width:400px;}
  .authcard .mark{font-family:var(--font-display); font-size:22px; font-weight:700; color:var(--accent); margin-bottom:4px;}
  .authcard .sub{color:var(--text-muted); font-size:13px; margin-bottom:22px;}
  .authtabs{display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:18px;}
  .authtabs button{flex:1; background:var(--surface-2); border:none; padding:8px; font-size:12.5px; font-weight:700; color:var(--text-muted);}
  .authtabs button.active{background:var(--accent); color:#fff;}
  .authform .field{margin-bottom:12px;}
  .authform label{display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); font-weight:700; margin-bottom:4px;}
  .authform input{width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:7px; padding:9px 10px; color:var(--text);}
  .authform .btn{width:100%; margin-top:6px; padding:10px;}
  .autherr{color:var(--risk-critico); font-size:12.5px; margin-top:10px; min-height:1px;}
  .authmsg{color:var(--risk-bajo); font-size:12.5px; margin-top:10px; min-height:1px;}
  .userbadge{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-muted);}
  .userbadge button{background:none; border:none; color:var(--accent); font-weight:600; font-size:12px;}
  #authRoot[hidden], #appRoot[hidden]{display:none;}
</style>
</head>
<body>

<div id="authRoot"></div>

<div id="appRoot" hidden>
<div id="app">
  <header class="appbar">
    <div class="brand">
      <div class="mark">Consola CPGRTI</div>
      <div class="org">Organización: <input id="orgNameInput" type="text" /></div>
    </div>
    <div class="headctl no-print">
      <div class="field">
        <label>Tolerancia máxima aceptada</label>
        <select id="toleranceSelect"></select>
      </div>
      <div class="field">
        <label>Fecha de corte</label>
        <input id="cutoffDate" type="date" />
      </div>
      <button class="btn subtle" id="snapshotBtn" title="Registra el estado actual de riesgos como punto histórico para el gráfico de evolución">Registrar snapshot mensual</button>
      <button class="btn ghost" id="resetBtn">Restablecer datos de ejemplo</button>
      <div class="userbadge" id="userBadge"></div>
    </div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>
  <footer class="appfoot">Metodología de Gestión del Riesgo Tecnológico — Riesgo = Probabilidad × Impacto × (Criticidad del Activo / 4) · Escalas y umbrales conforme a la Metodología CPGRTI · Herramienta genérica, aplicable a cualquier organización.</footer>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
</div>

<script>
(function(){
"use strict";

/* =========================================================
   CONSTANTS — scales, thresholds, taxonomies (from Metodología)
   ========================================================= */
var PROB_SCALE = [
  {v:1,label:"Rara vez",desc:"Menos de una vez cada 5 años"},
  {v:2,label:"Improbable",desc:"Una vez cada 2-5 años"},
  {v:3,label:"Posible",desc:"Una vez cada 1-2 años"},
  {v:4,label:"Probable",desc:"Varias veces al año"},
  {v:5,label:"Casi certeza",desc:"Mensual o más frecuente"}
];
var IMPACT_SCALE = [
  {v:1,label:"Insignificante",desc:"Sin afectación relevante"},
  {v:2,label:"Menor",desc:"Afectación localizada, impacto bajo"},

/* indicator status: verde/amarillo/rojo depending on whether higher-is-better or lower-is-better */
function kriStatus(k){
  var val = k.historico[k.historico.length-1];
  var higherBetter = k.umbralVerde >= k.umbralRojo; // e.g. umbralVerde=95 (>=), umbralRojo=90 (<) -> higher better
  if(higherBetter){
    if(val>=k.umbralVerde) return "verde";
    if(val>=k.umbralRojo) return "amarillo";
    return "rojo";
  } else {
    if(val<=k.umbralVerde) return "verde";
    if(val<=k.umbralRojo) return "amarillo";
    return "rojo";
  }
}

/* =========================================================
   STATE / PERSISTENCE — respaldado en Supabase (org_data), un documento JSON por organización.
   ========================================================= */
var SB = null;
var STATE = null;
var CURRENT_ORG_ID = null;
var CURRENT_USER = null;
var _saveTimer = null;

async function loadState(){
  var { data, error } = await SB.from("org_data").select("data").eq("org_id", CURRENT_ORG_ID).maybeSingle();
  if(error){ console.error(error); toast("Error al cargar los datos: " + error.message); STATE = seedState(); deriveControlsIfNeeded(); return; }
  if(data && data.data){
    STATE = data.data;
    deriveControlsIfNeeded();
    return;
  }
  // primera vez de esta organización: sembrar con datos de ejemplo y crear el documento
  STATE = seedState();
  deriveControlsIfNeeded();
  await SB.from("org_data").insert({ org_id: CURRENT_ORG_ID, data: STATE, updated_by: CURRENT_USER.id });
}
function saveState(){
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(async function(){
    var { error } = await SB.from("org_data")
      .update({ data: STATE, updated_at: new Date().toISOString(), updated_by: CURRENT_USER.id })
      .eq("org_id", CURRENT_ORG_ID);
    if(error){ console.error(error); toast("No se pudo guardar: " + error.message); }
  }, 400);
}
function deriveControlsIfNeeded(){
  if(STATE.controles && STATE.controles.length) return;
  var seen = {}; var list = [];
  var effCycle = ["Efectivo","Efectivo","Parcialmente efectivo","Efectivo","No efectivo"];
  var tipoCycle = ["Preventivo","Detectivo","Preventivo","Correctivo"];
  var idx = 0;
  STATE.risks.forEach(function(risk){
    (risk.controles||"").split(";").forEach(function(cRaw){
      var c = cRaw.trim();
      if(!c || seen[c]) { if(seen[c]) seen[c].riesgos.push(risk.id); return; }
      seen[c] = {nombre:c, riesgos:[risk.id]};
      list.push(seen[c]);
    });
  });
  STATE.controles = list.map(function(c,i){
    return {
      id:"C-"+String(i+1).padStart(3,"0"),
      nombre:c.nombre,
      riesgos:c.riesgos,
      tipo:tipoCycle[i%tipoCycle.length],
      efectividad:effCycle[i%effCycle.length],
      ultimaPrueba: "2026-0"+((i%6)+1)+"-15"
    };
  });
}

function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];}); }
function fmtDT(v){
  if(!v) return "—";
  var d = new Date(v);
  if(isNaN(d)) return v;
  return d.toLocaleDateString("es-ES",{day:"2-digit",month:"short",year:"numeric"}) + " " + d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
}
function fmtD(v){
  if(!v) return "—";
  var d = new Date(v+"T00:00:00");
  if(isNaN(d)) return v;
  return d.toLocaleDateString("es-ES",{day:"2-digit",month:"short",year:"numeric"});
}
function hoursBetween(a,b){
  if(!a||!b) return null;
  var da=new Date(a), db=new Date(b);
  if(isNaN(da)||isNaN(db)) return null;
  return (db-da)/36e5;
}
function round1(n){ return Math.round(n*10)/10; }
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._h);
  toast._h = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}
function uid(prefix, arr){
  var n = 1;
  arr.forEach(function(x){ var m=/(\d+)$/.exec(x.id); if(m){ n=Math.max(n, +m[1]+1); } });
  return prefix + "-" + String(n).padStart(3,"0");
}

/* incident computed fields */
function incComputed(i){
  var rtoRow = STATE.rtoTable.filter(function(x){ return x.proceso===i.proceso; })[0];
  var rto = rtoRow ? rtoRow.rtoHoras : null;
  var mttd = hoursBetween(i.fechaOcurrencia, i.fechaDeteccion);
  var resolved = !!i.fechaResolucion;
  var mttr = resolved ? hoursBetween(i.fechaDeteccion, i.fechaResolucion) : hoursBetween(i.fechaDeteccion, STATE.cutoffDate+"T"+ "23:59");
  var severidad = (SEVERITY_MATRIX[i.impacto]||{})[i.urgencia] || "Medio";
  var superaRTO = (rto!=null && mttr!=null) ? (mttr > rto) : false;
  return {rto:rto, mttd:mttd, mttr:mttr, resolved:resolved, severidad:severidad, superaRTO:superaRTO};
}

/* =========================================================
   DASHBOARD
   ========================================================= */
function sparkSVG(values, opts){
  opts = opts || {};
  var w = opts.w||220, h=opts.h||52, pad=4;
  var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
  if(min===max){ min -= 1; max += 1; }
  var stepX = (w-pad*2)/(values.length-1);
  var pts = values.map(function(v,i){
    var x = pad + i*stepX;
    var y = h - pad - ( (v-min)/(max-min) ) * (h-pad*2);
    return [x,y];
  });
  var line = pts.map(function(p,i){ return (i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1); }).join(" ");
  var area = line + " L"+pts[pts.length-1][0].toFixed(1)+","+(h-pad)+" L"+pts[0][0].toFixed(1)+","+(h-pad)+" Z";
  var color = opts.color || "var(--accent)";
  var last = pts[pts.length-1];
  return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="tendencia">'+
    '<line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'" stroke="var(--border)" stroke-width="1"/>'+
    '<path d="'+area+'" fill="'+color+'" opacity="0.14"></path>'+
    '<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="2"></path>'+
    '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3" fill="'+color+'"></circle>'+
  '</svg>';
}

function stackedAreaSVG(evolucion){
  var w=640, h=190, pad=30;
  var maxTotal = Math.max.apply(null, evolucion.map(function(e){ return e.bajo+e.medio+e.alto+e.critico; }));
  maxTotal = Math.max(maxTotal, 1);
  var n = evolucion.length;
  var stepX = (w-pad*1.5-20)/(n-1);
  var keys = ["bajo","medio","alto","critico"];
  var colors = {bajo:"var(--risk-bajo)",medio:"var(--risk-medio)",alto:"var(--risk-alto)",critico:"var(--risk-critico)"};
  function yOf(v){ return h-pad - (v/maxTotal)*(h-pad-14); }
  var layers = {}; keys.forEach(function(k){layers[k]=[];});
  evolucion.forEach(function(e,i){
    var acc=0;
    keys.forEach(function(k){
      var x = pad + i*stepX;
      var y0 = yOf(acc); acc += e[k]; var y1 = yOf(acc);
      layers[k].push([x,y0,y1]);
    });
  });
  var paths = keys.map(function(k){
    var top = layers[k].map(function(p,i){ return (i===0?"M":"L")+p[0].toFixed(1)+","+p[2].toFixed(1); }).join(" ");
    var bottom = layers[k].slice().reverse().map(function(p){ return "L"+p[0].toFixed(1)+","+p[1].toFixed(1); }).join(" ");
    return '<path d="'+top+" "+bottom+' Z" fill="'+colors[k]+'" opacity="0.85"></path>';
  }).join("");
  var xlabels = evolucion.map(function(e,i){
    var x = pad + i*stepX;
    return '<text x="'+x.toFixed(1)+'" y="'+(h-8)+'" font-size="10" fill="var(--text-muted)" text-anchor="middle">'+e.fecha.slice(5)+'</text>';
  }).join("");
  return '<svg width="100%" height="'+h+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="evolución de riesgos por nivel">'+
    '<line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-16)+'" y2="'+(h-pad)+'" stroke="var(--border)" stroke-width="1"/>'+
    paths + xlabels +
  '</svg>';
}

/* ---- Heatmap widget: dimensión de impacto seleccionable, vista inherente/residual, filtros ---- */
var HEATMAP_UI = {
  dimension:"financiero", vista:"residual",
  proceso:"Todos", amenaza:"Todos", vulnerabilidad:"Todos",
  selectedKey:null
};
function distinctValues(risks, field){
  var seen = {}; var out = [];
  risks.forEach(function(x){ var v=x[field]; if(v && !seen[v]){ seen[v]=1; out.push(v); } });
  out.sort();
  return out;
}
function heatmapFilteredRisks(){
  return STATE.risks.filter(function(x){
    if(HEATMAP_UI.proceso!=="Todos" && x.activo!==HEATMAP_UI.proceso) return false;
    if(HEATMAP_UI.amenaza!=="Todos" && x.amenaza!==HEATMAP_UI.amenaza) return false;
    if(HEATMAP_UI.vulnerabilidad!=="Todos" && x.vulnerabilidad!==HEATMAP_UI.vulnerabilidad) return false;
    return true;
  });
}
function heatmapWidgetHTML(){
  var vista = HEATMAP_UI.vista;
  var dim = HEATMAP_UI.dimension;
  var risks = heatmapFilteredRisks();
  var threshold = TOLERANCE_LEVELS[STATE.toleranceLevel];
  function probOf(x){ return vista==="inherente" ? x.probabilidad : x.probabilidadResidual; }
  function impOf(x){ return (vista==="inherente" ? x.impactos : x.impactosResidual)[dim]; }
  var cells = {};
  risks.forEach(function(x){
    var key = probOf(x)+"_"+impOf(x);
    cells[key] = cells[key] || [];
    cells[key].push(x);
  });

  var toolbar = '<div class="heatmap-toolbar">'+
    '<div class="dim-tabs">'+DIMENSIONES.map(function(d){
      return '<button class="dim-tab'+(d.key===dim?" active":"")+'" data-hdim="'+d.key+'">'+esc(d.label)+'</button>';
    }).join("")+'</div>'+
    '<div class="vista-toggle">'+
      '<button data-hvista="residual" class="'+(vista==="residual"?"active":"")+'">Residual</button>'+
      '<button data-hvista="inherente" class="'+(vista==="inherente"?"active":"")+'">Inherente</button>'+
    '</div>'+
  '</div>';

  var procesos = distinctValues(STATE.risks,"activo");

    '<div><span class="flabel">Proceso / activo tecnológico</span><select data-hf="proceso">'+
      '<option'+(HEATMAP_UI.proceso==="Todos"?" selected":"")+'>Todos</option>'+
      procesos.map(function(v){ return '<option'+(v===HEATMAP_UI.proceso?" selected":"")+'>'+esc(v)+'</option>'; }).join("")+
    '</select></div>'+
    '<div><span class="flabel">Amenaza / evento potencial</span><select data-hf="amenaza">'+
      '<option'+(HEATMAP_UI.amenaza==="Todos"?" selected":"")+'>Todos</option>'+
      amenazas.map(function(v){ return '<option'+(v===HEATMAP_UI.amenaza?" selected":"")+'>'+esc(v)+'</option>'; }).join("")+
    '</select></div>'+
    '<div><span class="flabel">Vulnerabilidad explotada</span><select data-hf="vulnerabilidad">'+
      '<option'+(HEATMAP_UI.vulnerabilidad==="Todos"?" selected":"")+'>Todos</option>'+
      vulnerabilidades.map(function(v){ return '<option'+(v===HEATMAP_UI.vulnerabilidad?" selected":"")+'>'+esc(v)+'</option>'; }).join("")+
    '</select></div>'+
  '</div>';

  var colHeads = IMPACT_SCALE.map(function(s){
    return '<th class="colhead">'+s.v+'. '+esc(s.label)+'<span class="sub">'+esc(s.desc)+'</span></th>';
  }).join("");
  var bodyRows = "";
  for(var p=5; p>=1; p--){
    var rowCells = "";
    for(var i=1; i<=5; i++){
      var group = cells[p+"_"+i] || [];
      var cls = HEAT_BAND[p+"_"+i];
      var over = group.filter(function(g){ return riskScoreFor(g,vista) > threshold; }).length;
      var key = p+"_"+i;
      var selected = HEATMAP_UI.selectedKey===key ? " selected" : "";
      rowCells += '<td class="heat-td'+selected+'" style="background:var(--risk-'+cls+')" data-hcell="'+key+'" title="'+esc(group.map(function(g){return g.id;}).join(", "))+'">'+
        '<span class="count-badge">'+group.length+'</span>'+
        (over? '<span class="warn-badge">⚠'+(over>1?over:"")+'</span>':'')+
      '</td>';
    }
    var probMeta = PROB_SCALE[p-1];
    bodyRows += '<tr><th class="rowhead">'+probMeta.v+'. '+esc(probMeta.label)+'<span class="sub">'+esc(probMeta.desc)+'</span></th>'+rowCells+'</tr>';
  }
  var table = '<div class="tablewrap"><table class="heatmap-table">'+
    '<thead><tr><th class="corner">Frecuencia<span class="sub">Probabilidad</span></th>'+colHeads+'</tr></thead>'+
    '<tbody>'+bodyRows+'</tbody>'+
  '</table></div>';

  var detail = "";
  if(HEATMAP_UI.selectedKey){
    var parts = HEATMAP_UI.selectedKey.split("_");
    var selGroup = cells[HEATMAP_UI.selectedKey] || [];
    detail = '<div class="heatmap-detail">'+
      '<div class="hdr"><span>Probabilidad '+parts[0]+' × '+DIMENSIONES.filter(function(d){return d.key===dim;})[0].label+' '+parts[1]+' ('+vista+') — '+selGroup.length+' riesgo(s)</span><button data-hclose="1">Cerrar ✕</button></div>'+
      (selGroup.length ? selGroup.map(function(g){
        return '<div class="item"><b>'+esc(g.id)+'</b> · '+esc(g.descripcion)+'<br><span class="muted small">'+esc(g.activo)+' · Amenaza: '+esc(g.amenaza)+' · Vulnerabilidad: '+esc(g.vulnerabilidad)+'</span></div>';
      }).join("") : '<div class="item muted">Sin riesgos en esta celda con los filtros actuales.</div>')+
    '</div>';
  }

  return '<div class="heatmap-widget">'+toolbar+filters+table+detail+
    '<div class="muted small" style="margin-top:8px;">Cada celda: riesgos identificados en la vista y dimensión seleccionadas · ⚠ = supera la tolerancia (' +STATE.toleranceLevel+ ') · click en una celda para ver el detalle.</div>'+
  '</div>';
}

function statCard(label,value,sub,warn){
  return '<div class="card stat'+(warn?" warn":"")+'"><div class="label">'+esc(label)+'</div><div class="value num">'+value+'</div><div class="sub">'+esc(sub)+'</div></div>';
}
function classBars(byClass){
  var order=[["Crítico","critico"],["Alto","alto"],["Medio","medio"],["Bajo","bajo"]];
  var total = byClass.Bajo+byClass.Medio+byClass.Alto+byClass["Crítico"] || 1;
  return order.map(function(o){
    var v = byClass[o[0]];
    var pct = Math.round(v/total*100);
    return '<div style="margin-bottom:10px;">'+
      '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;"><span class="pill '+o[1]+'">'+o[0]+'</span><span class="num">'+v+'</span></div>'+
      '<div class="procbar"><div style="width:'+pct+'%;background:var(--risk-'+o[1]+')"></div></div>'+
    '</div>';
  }).join("");
}
function legendRow(){
  return '<div style="display:flex;gap:14px;margin-top:8px;flex-wrap:wrap;">'+
    ["bajo","medio","alto","critico"].map(function(k){
      var label = {bajo:"Bajo",medio:"Medio",alto:"Alto",critico:"Crítico"}[k];
      return '<span class="small muted" style="display:flex;align-items:center;gap:5px;"><span style="width:9px;height:9px;border-radius:2px;background:var(--risk-'+k+');display:inline-block;"></span>'+label+'</span>';
    }).join("")+'</div>';
}
function indicatorRow(k){
  var status = kriStatus(k);
  var val = k.historico[k.historico.length-1];
  var suffix = k.unidad==="pct" ? "%" : "";
  return '<div class="kri-row">'+

    '<div class="kri-meta"><div class="name">'+esc(k.nombre)+'</div><div class="type">'+esc(k.tipo)+' · '+esc(k.frecuencia)+' · dueño '+esc(k.dueno)+'</div></div>'+

/* =========================================================
   INFORMAR Y REPORTAR
   ========================================================= */
function buildReportText(){
  var risks = STATE.risks;
  var scored = risks.map(function(x){ return {r:x, score:riskScoreFor(x,"residual")}; });
  var threshold = TOLERANCE_LEVELS[STATE.toleranceLevel];
  var over = scored.filter(function(x){return x.score>threshold;}).sort(function(a,b){return b.score-a.score;});
  var byClass = {Bajo:0,Medio:0,Alto:0,"Crítico":0};
  scored.forEach(function(x){ byClass[riskClass(x.score)]++; });
  var incC = STATE.incidentes.map(function(i){return {i:i,c:incComputed(i)};});
  var overRTO = incC.filter(function(x){return x.c.superaRTO;});
  var indBy = {rojo:[],amarillo:[],verde:[]};
  STATE.indicadores.forEach(function(k){ indBy[kriStatus(k)].push(k); });

  var lines = [];
  lines.push("# Informe de Riesgo Tecnológico");
  lines.push("");
  lines.push("**Organización:** " + STATE.orgName);
  lines.push("**Fecha de corte:** " + fmtD(STATE.cutoffDate));
  lines.push("**Tolerancia máxima aceptada:** " + STATE.toleranceLevel + " (puntaje ≤ " + threshold + ")");
  lines.push("");
  lines.push("## 1. Resumen del perfil de riesgo");
  lines.push("- Riesgos identificados: " + risks.length);
  lines.push("- Distribución: Bajo " + byClass.Bajo + " · Medio " + byClass.Medio + " · Alto " + byClass.Alto + " · Crítico " + byClass["Crítico"]);
  lines.push("- Riesgos que superan la tolerancia definida: **" + over.length + "**");
  lines.push("");
  if(over.length){
    lines.push("## 2. Riesgos que superan la tolerancia");
    over.forEach(function(x){
      lines.push("- **" + x.r.id + "** (" + riskClass(x.score) + ", puntaje " + round1(x.score) + ") — " + x.r.descripcion + ". Activo: " + x.r.activo + ". Estrategia: " + x.r.estrategia + ". Dueño: " + x.r.dueno + ". Estado: " + x.r.estado + ".");
    });
    lines.push("");
  }
  lines.push("## 3. Indicadores (KRI / KPI / KCI)");
  lines.push("- En zona roja: " + indBy.rojo.length + (indBy.rojo.length? " — " + indBy.rojo.map(function(k){return k.nombre;}).join("; "):""));
  lines.push("- En zona amarilla: " + indBy.amarillo.length + (indBy.amarillo.length? " — " + indBy.amarillo.map(function(k){return k.nombre;}).join("; "):""));
  lines.push("- En zona verde: " + indBy.verde.length);
  lines.push("");
  lines.push("## 4. Incidentes tecnológicos");
  lines.push("- Total registrados en el periodo: " + STATE.incidentes.length);
  lines.push("- Incidentes que superan el RTO del proceso/activo afectado: **" + overRTO.length + "**");
  overRTO.forEach(function(x){
    lines.push("  - " + x.i.id + " — " + x.i.descripcion + " (MTTR " + round1(x.c.mttr) + "h vs. RTO " + x.c.rto + "h)");
  });
  lines.push("");
  lines.push("## 5. Proveedores tecnológicos");
  STATE.proveedores.forEach(function(p){
    var s = providerScore(p);
    lines.push("- " + p.nombre + ": puntaje " + round1(s) + " — nivel " + providerTier(s));
  });
  lines.push("");
  lines.push("## 6. Recomendación");
  lines.push(over.length || overRTO.length || indBy.rojo.length
    ? "Se recomienda escalar al Comité de Riesgos los riesgos y hallazgos señalados en las secciones 2 y 4, priorizando aquellos en nivel Crítico y los incidentes que superan el RTO definido."
    : "El perfil de riesgo tecnológico se encuentra dentro de los niveles de tolerancia definidos; se recomienda mantener el monitoreo periódico establecido en la Metodología.");
  return lines.join("\n");
}

function viewInformar(){
  var txt = buildReportText();
  var htmlPreview = txt.split("\n").map(function(line){
    if(line.startsWith("# ")) return "<h2 style='margin:6px 0'>"+esc(line.slice(2))+"</h2>";
    if(line.startsWith("## ")) return "<h3 style='margin:14px 0 6px'>"+esc(line.slice(3))+"</h3>";
    if(line.startsWith("- ")) return "<div style='padding:2px 0 2px 14px;font-size:13px;'>• "+esc(line.slice(2))+"</div>";
    if(line.trim()==="") return "<div style='height:6px'></div>";
    return "<div style='font-size:13px;padding:2px 0;'>"+esc(line)+"</div>";
  }).join("");
  return ''+
  '<div class="view-title"><h2>⑦ Informar y reportar</h2><div class="no-print" style="display:flex;gap:8px;"><button class="btn subtle" id="printBtn">Imprimir</button><button class="btn" id="downloadBtn">Descargar (.md)</button></div></div>'+
  '<div class="view-sub">Informe ejecutivo compilado automáticamente a partir del estado actual del inventario de riesgos, indicadores, incidentes y proveedores — listo para el Comité de Riesgos.</div>'+
  '<div class="card" id="reportCard" style="max-width:840px;">'+htmlPreview+'</div>';
}

      impactos:impactos, impactosResidual:impactosResidual, criticidad:+fd.get("criticidad"),
      estrategia: fd.get("estrategia"), controles: fd.get("controles"),
      dueno: fd.get("dueno"), estado: fd.get("estado")
    };
    if(isNew){
      obj.id = uid("R", STATE.risks);
      obj.fechaId = STATE.cutoffDate; obj.fechaRev = STATE.cutoffDate;
      STATE.risks.push(obj);
      toast("Riesgo "+obj.id+" registrado");
    } else {
      Object.assign(risk, obj);
      risk.fechaRev = STATE.cutoffDate;
      toast("Riesgo "+risk.id+" actualizado");
    }
    deriveControlsIfNeeded_forceRefresh();
    saveState(); closeModal(); renderAll();
  });
}
function deriveControlsIfNeeded_forceRefresh(){
  // recompute control<->risk linkage without discarding manual effectiveness ratings
  var effByName = {}; STATE.controles.forEach(function(c){ effByName[c.nombre] = c; });
  var seen = {}; var list = [];
  STATE.risks.forEach(function(risk){
    (risk.controles||"").split(";").forEach(function(cRaw){
      var c = cRaw.trim(); if(!c) return;
      if(!seen[c]){ seen[c] = {nombre:c, riesgos:[]}; list.push(seen[c]); }
      if(seen[c].riesgos.indexOf(risk.id)===-1) seen[c].riesgos.push(risk.id);
    });
  });
  var effCycle = ["Efectivo","Efectivo","Parcialmente efectivo","Efectivo","No efectivo"];
  var tipoCycle = ["Preventivo","Detectivo","Preventivo","Correctivo"];
  STATE.controles = list.map(function(c,i){
    var prev = effByName[c.nombre];
    return {
      id: prev? prev.id : "C-"+String(i+1).padStart(3,"0"),
      nombre:c.nombre, riesgos:c.riesgos,
      tipo: prev? prev.tipo : tipoCycle[i%tipoCycle.length],
      efectividad: prev? prev.efectividad : effCycle[i%effCycle.length],
      ultimaPrueba: prev? prev.ultimaPrueba : "2026-0"+((i%6)+1)+"-15"
    };
  });
}

function openIncModal(id){
  var inc0 = id ? STATE.incidentes.filter(function(x){return x.id===id;})[0] : null;
  var isNew = !inc0;
  var v = inc0 || {descripcion:"",proceso:STATE.rtoTable[0].proceso,fechaOcurrencia:"",fechaDeteccion:"",fechaResolucion:"",impacto:"Medio",urgencia:"Media",estado:"Abierto"};
  var procList = STATE.rtoTable.map(function(p){return p.proceso;});
  var html = ''+
  '<h3>'+(isNew?"Nuevo incidente":"Editar incidente "+inc0.id)+'</h3>'+
  '<form id="incForm">'+
  '<div class="formgrid">'+
    fieldFull("Descripción","descripcion","text",null,v.descripcion)+
    field("Proceso / activo afectado","proceso","select",procList,v.proceso)+
    field("Estado","estado","select",["Abierto","Resuelto"],v.estado)+
    field("Impacto","impacto","select",["Alto","Medio","Bajo"],v.impacto)+
    field("Urgencia","urgencia","select",["Alta","Media","Baja"],v.urgencia)+
    field("Fecha/hora de ocurrencia","fechaOcurrencia","datetime-local",null,v.fechaOcurrencia)+
    field("Fecha/hora de detección","fechaDeteccion","datetime-local",null,v.fechaDeteccion)+
    field("Fecha/hora de resolución","fechaResolucion","datetime-local",null,v.fechaResolucion)+
  '</div>'+
  '<div class="modal-actions">'+
    (isNew? "" : '<button type="button" class="btn danger" id="delIncBtn">Eliminar</button>')+
    '<button type="button" class="btn subtle" id="cancelBtn">Cancelar</button>'+
    '<button type="submit" class="btn">Guardar</button>'+
  '</div>'+
  '</form>';
  openModal(html);
  document.getElementById("cancelBtn").addEventListener("click", closeModal);
  if(!isNew){
    document.getElementById("delIncBtn").addEventListener("click", function(){
      STATE.incidentes = STATE.incidentes.filter(function(x){return x.id!==inc0.id;});
      saveState(); closeModal(); renderAll(); toast("Incidente eliminado");
    });
  }
  document.getElementById("incForm").addEventListener("submit", function(e){
    e.preventDefault();
    var fd = new FormData(e.target);
    var obj = {
      descripcion:fd.get("descripcion"), proceso:fd.get("proceso"), estado:fd.get("estado"),
      impacto:fd.get("impacto"), urgencia:fd.get("urgencia"),
      fechaOcurrencia:fd.get("fechaOcurrencia")||null, fechaDeteccion:fd.get("fechaDeteccion")||null,
      fechaResolucion: fd.get("estado")==="Resuelto" ? (fd.get("fechaResolucion")||null) : null
    };
    if(isNew){
      obj.id = uid("I", STATE.incidentes);
      STATE.incidentes.push(obj);
      toast("Incidente "+obj.id+" registrado");
    } else {
      Object.assign(inc0, obj);
      toast("Incidente "+inc0.id+" actualizado");
    }
    saveState(); closeModal(); renderAll();
  });
}

function field(label,name,type,options,value){
  if(type==="select"){
    return '<div class="field"><label>'+esc(label)+'</label><select name="'+name+'">'+selectOptions(options,value)+'</select></div>';
  }
  return '<div class="field"><label>'+esc(label)+'</label><input type="'+type+'" name="'+name+'" value="'+esc(value||"")+'"></div>';
}
function fieldFull(label,name,type,options,value){
  if(type==="textarea"){
    return '<div class="field full"><label>'+esc(label)+'</label><textarea name="'+name+'">'+esc(value||"")+'</textarea></div>';
  }
  if(type==="select"){
    return '<div class="field full"><label>'+esc(label)+'</label><select name="'+name+'">'+selectOptions(options,value)+'</select></div>';
  }
  return '<div class="field full"><label>'+esc(label)+'</label><input type="'+type+'" name="'+name+'" value="'+esc(value||"")+'"></div>';
}
function fieldSel(label,name,scale,value){
  return '<div class="field"><label>'+esc(label)+'</label><select name="'+name+'">'+numOptions(scale,value)+'</select></div>';
}
function emptyRow(colspan,msg){
  return '<tr><td colspan="'+colspan+'"><div class="empty"><span class="big">—</span>'+esc(msg)+'</div></td></tr>';
}

/* =========================================================
   MAIN RENDER / EVENTS
   ========================================================= */
function renderMain(){
  var html = "";
  switch(ACTIVE_TAB){
    case "dashboard": html = viewDashboard(); break;
    case "identificar": html = viewIdentificar(); break;
    case "evaluar": html = viewEvaluar(); break;
    case "tratar": html = viewTratar(); break;
    case "controlar": html = viewControlar(); break;
    case "monitorear": html = viewMonitorear(); break;
    case "incidentes": html = viewIncidentes(); break;
    case "informar": html = viewInformar(); break;
    case "proveedores": html = viewProveedores(); break;
  }
  document.getElementById("main").innerHTML = html;
  bindMainEvents();
}
function bindMainEvents(){
  if(document.querySelector(".heatmap-widget")) bindHeatmapEvents();
  document.querySelectorAll("[data-edit-risk]").forEach(function(b){
    b.addEventListener("click", function(){ openRiskModal(b.getAttribute("data-edit-risk")); });
  });
  document.querySelectorAll("[data-edit-inc]").forEach(function(b){
    b.addEventListener("click", function(){ openIncModal(b.getAttribute("data-edit-inc")); });
  });
  var newRisk = document.getElementById("newRiskBtn");
  if(newRisk) newRisk.addEventListener("click", function(){ openRiskModal(null); });
  var newInc = document.getElementById("newIncBtn");
  if(newInc) newInc.addEventListener("click", function(){ openIncModal(null); });
  var printBtn = document.getElementById("printBtn");
  if(printBtn) printBtn.addEventListener("click", function(){ window.print(); });
  var dlBtn = document.getElementById("downloadBtn");
  if(dlBtn) dlBtn.addEventListener("click", function(){
    var blob = new Blob([buildReportText()], {type:"text/markdown;charset=utf-8"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "Informe-Riesgo-Tecnologico-"+STATE.cutoffDate+".md";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);}, 1000);
  });
}

function renderHeader(){
  document.getElementById("orgNameInput").value = STATE.orgName;
  var tSel = document.getElementById("toleranceSelect");
  tSel.innerHTML = Object.keys(TOLERANCE_LEVELS).map(function(k){
    return '<option value="'+k+'" '+(k===STATE.toleranceLevel?"selected":"")+'>'+k+' (≤ '+TOLERANCE_LEVELS[k]+')</option>';
  }).join("");
  document.getElementById("cutoffDate").value = STATE.cutoffDate;
  var badge = document.getElementById("userBadge");
  if(badge){
    badge.innerHTML = esc(CURRENT_USER.email) + ' <button id="logoutBtn" type="button">Cerrar sesión</button>';
    document.getElementById("logoutBtn").addEventListener("click", async function(){
      await SB.auth.signOut();
      window.location.reload();
    });
  }
}

function renderAll(){
  renderHeader();
  renderTabs();
  renderMain();
}

/* header events (bound once) */
function bindHeaderEvents(){
  document.getElementById("orgNameInput").addEventListener("input", function(e){
    STATE.orgName = e.target.value || "[Nombre de la Organización]";
    saveState();
  });
  document.getElementById("toleranceSelect").addEventListener("change", function(e){
    STATE.toleranceLevel = e.target.value; saveState(); renderAll();
  });
  document.getElementById("cutoffDate").addEventListener("change", function(e){
    STATE.cutoffDate = e.target.value; saveState(); renderAll();
  });
  document.getElementById("snapshotBtn").addEventListener("click", function(){
    var byClass = {bajo:0,medio:0,alto:0,critico:0};
    STATE.risks.forEach(function(x){ byClass[classKey(riskClass(riskScoreFor(x,"residual")))]++; });
    var label = STATE.cutoffDate.slice(0,7);
    var existing = STATE.evolucion.filter(function(e){return e.fecha===label;})[0];
    if(existing){ Object.assign(existing, byClass); }
    else { STATE.evolucion.push({fecha:label, bajo:byClass.bajo, medio:byClass.medio, alto:byClass.alto, critico:byClass.critico}); }
    STATE.evolucion.sort(function(a,b){return a.fecha<b.fecha?-1:1;});
    saveState(); renderAll(); toast("Snapshot de "+label+" registrado en la evolución de riesgo");
  });
  document.getElementById("resetBtn").addEventListener("click", async function(){
    if(!confirm("¿Restablecer todos los datos de tu organización a los valores de ejemplo? Se perderán los cambios realizados por todo tu equipo.")) return;
    STATE = seedState();
    deriveControlsIfNeeded();
    await SB.from("org_data").update({ data: STATE, updated_at: new Date().toISOString(), updated_by: CURRENT_USER.id }).eq("org_id", CURRENT_ORG_ID);
    renderAll(); toast("Datos de ejemplo restablecidos");
  });
}

/* =========================================================
   AUTENTICACIÓN Y ALTA DE ORGANIZACIÓN (Supabase Auth)
   ========================================================= */
function showAuth(html){
  document.getElementById("appRoot").hidden = true;
  var ar = document.getElementById("authRoot");
  ar.hidden = false;
  ar.innerHTML = html;
}
function showApp(){
  document.getElementById("authRoot").hidden = true;
  document.getElementById("authRoot").innerHTML = "";
  document.getElementById("appRoot").hidden = false;
}
function renderConfigMissing(){
  showAuth('<div class="authwrap"><div class="authcard">'+
    '<div class="mark">Consola CPGRTI</div>'+
    '<div class="sub">Falta configurar la conexión a la base de datos.</div>'+
    '<div class="autherr">Crea un archivo <code>config.js</code> junto a esta página (copia <code>config.example.js</code>) con tu URL y clave anónima de Supabase, y vuelve a cargar la página. Ver README.md para el paso a paso.</div>'+
  '</div></div>');
}
function renderAuthScreen(mode, err, msg){
  var isLogin = mode!=="signup";
  showAuth('<div class="authwrap"><div class="authcard">'+
    '<div class="mark">Consola CPGRTI</div>'+
    '<div class="sub">Gestión del riesgo tecnológico — acceso por organización</div>'+
    '<div class="authtabs">'+
      '<button type="button" data-authtab="login" class="'+(isLogin?"active":"")+'">Iniciar sesión</button>'+
      '<button type="button" data-authtab="signup" class="'+(!isLogin?"active":"")+'">Crear cuenta</button>'+
    '</div>'+
    '<form class="authform" id="authForm">'+
      '<div class="field"><label>Correo</label><input type="email" name="email" required autocomplete="email"></div>'+
      '<div class="field"><label>Contraseña</label><input type="password" name="password" required minlength="6" autocomplete="'+(isLogin?"current-password":"new-password")+'"></div>'+
      '<button type="submit" class="btn">'+(isLogin?"Iniciar sesión":"Crear cuenta")+'</button>'+
    '</form>'+
    '<div class="autherr" id="authErr">'+esc(err||"")+'</div>'+
    '<div class="authmsg" id="authMsg">'+esc(msg||"")+'</div>'+
  '</div></div>');
  document.querySelectorAll("[data-authtab]").forEach(function(b){
    b.addEventListener("click", function(){ renderAuthScreen(b.getAttribute("data-authtab")); });
  });
  document.getElementById("authForm").addEventListener("submit", async function(e){
    e.preventDefault();
    var fd = new FormData(e.target);
    var email = fd.get("email"), password = fd.get("password");
    var errEl = document.getElementById("authErr");
    errEl.textContent = "";
    if(isLogin){
      var { data, error } = await SB.auth.signInWithPassword({ email:email, password:password });
      if(error){ errEl.textContent = error.message; return; }
      CURRENT_USER = data.user;
      await routeAfterAuth();
    } else {
      var { data, error } = await SB.auth.signUp({ email:email, password:password });
      if(error){ errEl.textContent = error.message; return; }
      if(data.session){
        CURRENT_USER = data.user;
        await routeAfterAuth();
      } else {
        renderAuthScreen("login", "", "Cuenta creada. Revisa tu correo para confirmar la cuenta y luego inicia sesión.");
      }
    }
  });
}
function renderOrgSetupScreen(err){
  showAuth('<div class="authwrap"><div class="authcard">'+
    '<div class="mark">Configura tu organización</div>'+
    '<div class="sub">Vas a crear el espacio de trabajo de tu banco/organización en la Consola CPGRTI. Serás el administrador de esta organización.</div>'+
    '<form class="authform" id="orgForm">'+
      '<div class="field"><label>Nombre de la organización</label><input type="text" name="orgName" required placeholder="[Nombre de la Organización]"></div>'+
      '<button type="submit" class="btn">Crear organización y continuar</button>'+
    '</form>'+
    '<div class="autherr" id="orgErr">'+esc(err||"")+'</div>'+
  '</div></div>');
  document.getElementById("orgForm").addEventListener("submit", async function(e){
    e.preventDefault();
    var orgName = new FormData(e.target).get("orgName").trim();
    var errEl = document.getElementById("orgErr");
    var { data: org, error: orgErr } = await SB.from("organizations").insert({ name: orgName }).select("id").single();
    if(orgErr){ errEl.textContent = orgErr.message; return; }
    var { error: profErr } = await SB.from("profiles").insert({ id: CURRENT_USER.id, org_id: org.id, role: "admin", full_name: CURRENT_USER.email });
    if(profErr){ errEl.textContent = profErr.message; return; }
    CURRENT_ORG_ID = org.id;
    await loadState();
    STATE.orgName = orgName;
    saveState();
    showApp();
    bindHeaderEvents();
    renderAll();
  });
}
async function routeAfterAuth(){
  var { data: profile, error } = await SB.from("profiles").select("org_id, role, full_name").eq("id", CURRENT_USER.id).maybeSingle();
  if(error){ renderAuthScreen("login", error.message); return; }
  if(!profile){ renderOrgSetupScreen(); return; }
  CURRENT_ORG_ID = profile.org_id;
  await loadState();
  showApp();
  bindHeaderEvents();
  renderAll();
}
function initSupabase(){
  if(!window.SUPABASE_URL || !window.SUPABASE_ANON_KEY || !window.supabase){ renderConfigMissing(); return false; }
  SB = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  return true;
}
async function boot(){
  if(!initSupabase()) return;
  var { data:{ session } } = await SB.auth.getSession();
  if(!session){ renderAuthScreen("login"); return; }
  CURRENT_USER = session.user;
  await routeAfterAuth();
}

boot();

})();
